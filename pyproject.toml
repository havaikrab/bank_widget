[project]
name = "bank-widget"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "types-requests (>=2.32.4.20250913,<3.0.0.0)"
]

[tool.poetry]
packages = [{include = "bank_widget", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)"
]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.isort]
line_length = 119
lines_after_imports = 2

[tool.black]
line-length = 119
exclude = "\\.git"

[tool.mypy]
disallow_untyped_defs = true
exclude = 'venv'
